<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Brain (test chat)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1c1e21; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1f3a5f; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  select { padding: 6px; border-radius: 6px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 820px; padding: 10px 14px; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1f3a5f; color: #fff; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #dde0e4; }
  .denied { background: #fde8e8; }
  .not_found { background: #fff4d6; }
  .error { background: #fbd5d5; }
  .meta { font-size: 12px; color: #667; margin-top: 6px; white-space: normal; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; background: #e6ecf5; margin-right: 6px; }
  details { margin-top: 6px; font-size: 13px; white-space: normal; }
  pre { margin: 6px 0 0; padding: 8px; background: #f0f2f5; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .tablewrap { overflow-x: auto; margin-top: 6px; }
  table { border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #dde0e4; padding: 3px 8px; text-align: left; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #dde0e4; }
  input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #c4c8ce; font-size: 15px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1f3a5f; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<header>
  <h1>Company Brain: test chat</h1>
  <label>Role:
    <select id="role">
      <option>employee</option>
      <option>hr</option>
      <option>finance</option>
      <option>admin</option>
    </select>
  </label>
</header>
<div id="log"></div>
<form id="form">
  <input id="q" placeholder="Ask a question..." autocomplete="off" maxlength="500" autofocus>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');
const roleSel = document.getElementById('role');

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function render(r) {
  let h = esc(r.answer).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h += '<div class="meta"><span class="tag">type: ' + esc(r.type) + '</span>' +
       '<span class="tag">route: ' + esc(r.route) + '</span>' +
       '<span class="tag">role: ' + esc(r.role) + '</span></div>';
  if (r.sources && r.sources.length) {
    h += '<div class="meta">Sources: ' + r.sources.map(s =>
      esc(s.document + (s.id ? ' (' + s.id + ')' : ''))).join(', ') + '</div>';
  }
  if (r.sql) {
    h += '<details><summary>SQL used</summary><pre>' + esc(r.sql) + '</pre></details>';
  }
  if (r.data && r.data.rows && r.data.rows.length) {
    const rows = r.data.rows.slice(0, 50);
    h += '<details><summary>Data (' + r.data.rows.length + ' rows)</summary>' +
         '<div class="tablewrap"><table><tr>' +
         r.data.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
         rows.map(row => '<tr>' + row.map(v =>
           '<td>' + esc(v === null ? '' : v) + '</td>').join('') + '</tr>').join('') +
         '</table></div></details>';
  }
  add('bot ' + r.type, h);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  add('user', esc(question));
  input.value = '';
  send.disabled = true;
  const wait = add('bot', 'Thinking...');
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-Role': roleSel.value },
      body: JSON.stringify({ question })
    });
    wait.remove();
    if (!res.ok) { add('bot error', 'Server returned ' + res.status); }
    else { render(await res.json()); }
  } catch (err) {
    wait.remove();
    add('bot error', 'Could not reach the server. Is it running?');
  }
  send.disabled = false;
  input.focus();
});
</script>
</body>
</html>
